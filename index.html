<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resonansi — Ruang Publik ICW</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/responsive.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components/Icons.jsx"></script>
<script type="text/babel" src="components/Brand.jsx"></script>
<script type="text/babel" src="components/Content.jsx"></script>
<script type="text/babel" src="components/Nav.jsx"></script>
<script type="text/babel" src="components/Footer.jsx"></script>
<script type="text/babel" src="pages/HomeSections.jsx"></script>
<script type="text/babel" src="pages/Home.jsx"></script>
<script type="text/babel" src="pages/InnerPages.jsx"></script>
<script type="text/babel" src="pages/Library.jsx"></script>
<script type="text/babel" src="pages/JoinPage.jsx"></script>

</head>
<body>
<div id="root"></div>

<script>
  // EDITMODE: persisted defaults
  window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "lang": "id",
    "density": 0.95,
    "hero": "A"
  }/*EDITMODE-END*/;
</script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [lang, setLang] = useState(() => localStorage.getItem('reso.lang') || window.TWEAK_DEFAULTS.lang);
  const [density, setDensity] = useState(() => parseFloat(localStorage.getItem('reso.density') || window.TWEAK_DEFAULTS.density));
  const [hero, setHero] = useState(() => localStorage.getItem('reso.hero') || window.TWEAK_DEFAULTS.hero);
  const [page, setPage] = useState(() => localStorage.getItem('reso.page') || 'home');
  const [tweaksOn, setTweaksOn] = useState(false);

  const t = CONTENT[lang];

  useEffect(() => { localStorage.setItem('reso.lang', lang); document.documentElement.lang = lang; }, [lang]);
  useEffect(() => { localStorage.setItem('reso.density', density); document.documentElement.style.setProperty('--dx', density); }, [density]);
  useEffect(() => { localStorage.setItem('reso.hero', hero); }, [hero]);
  useEffect(() => { localStorage.setItem('reso.page', page); window.scrollTo(0,0); }, [page]);

  // Edit mode protocol
  useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type === '__activate_edit_mode')   setTweaksOn(true);
      if (d.type === '__deactivate_edit_mode') setTweaksOn(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const persist = (edits) => {
    window.parent.postMessage({ type:'__edit_mode_set_keys', edits }, '*');
  };

  const setLangP    = (v) => { setLang(v);    persist({ lang: v }); };
  const setDensityP = (v) => { setDensity(v); persist({ density: v }); };
  const setHeroP    = (v) => { setHero(v);    persist({ hero: v }); };

  return (
    <div style={{ display:'flex' }}>
      <div style={{ flex:1, minWidth: 0 }}>
        <Nav page={page} setPage={setPage} lang={lang} setLang={setLangP} t={t}/>
        <main data-screen-label={page}>
          {page === 'home'       && <Home         t={t} lang={lang} setPage={setPage} heroVariant={hero}/>}
          {page === 'about'      && <AboutPage    t={t} lang={lang}/>}
          {page === 'services'   && <ServicesPage t={t} lang={lang} setPage={setPage}/>}
          {page === 'activities' && <ActivitiesPage t={t} lang={lang}/>}
          {page === 'library'    && <LibraryPage  t={t} lang={lang}/>}
          {page === 'contact'    && <ContactPage  t={t} lang={lang}/>}
          {page === 'join'       && <JoinPage     t={t} lang={lang} setPage={setPage}/>}
        </main>
        <Footer t={t} lang={lang} setPage={setPage}/>
      </div>

      {tweaksOn && <TweaksPanel t={t} lang={lang} setLang={setLangP} density={density} setDensity={setDensityP} hero={hero} setHero={setHeroP}/>}
    </div>
  );
}

function TweaksPanel({ t, lang, setLang, density, setDensity, hero, setHero }) {
  const tw = t.tweaks;
  return (
    <div className="tweaks-panel" style={{
      position:'fixed', right: 24, bottom: 90, zIndex: 60,
      width: 300, background:'var(--paper)',
      border:'1px solid var(--line)', borderRadius: 18,
      boxShadow:'0 20px 50px rgba(0,74,120,0.18)',
      padding: 20,
    }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom: 16 }}>
        <div style={{ fontFamily:'var(--font-display)', fontWeight: 700, fontSize: 14, color:'var(--navy)' }}>{tw.title}</div>
        <div className="mono" style={{ fontSize: 10, color:'var(--muted)' }}>RESONANSI</div>
      </div>

      <TwLabel>{tw.lang}</TwLabel>
      <div style={{ display:'flex', gap: 6, marginTop: 6 }}>
        {[['id','Bahasa Indonesia'],['en','English']].map(([k,v])=>(
          <button key={k} onClick={()=>setLang(k)} style={{
            flex:1, padding:'10px', borderRadius: 10, cursor:'pointer',
            background: lang === k ? 'var(--navy)' : 'var(--bg)',
            color: lang === k ? '#FFF9E8' : 'var(--ink)',
            border:'1px solid ' + (lang === k ? 'var(--navy)' : 'var(--line)'),
            fontSize: 12, fontWeight: 600, fontFamily:'var(--font-display)',
          }}>{v}</button>
        ))}
      </div>

      <TwLabel style={{ marginTop: 18 }}>{tw.density} · {density.toFixed(2)}×</TwLabel>
      <input type="range" min="0.8" max="1.15" step="0.05" value={density} onChange={e=>setDensity(parseFloat(e.target.value))}
        style={{ width:'100%', marginTop: 8, accentColor: 'var(--navy)' }}/>
      <div className="mono" style={{ display:'flex', justifyContent:'space-between', fontSize: 9, color:'var(--muted)', marginTop: 2 }}>
        <span>{lang==='id'?'rapat':'compact'}</span><span>{lang==='id'?'lapang':'airy'}</span>
      </div>

      <TwLabel style={{ marginTop: 18 }}>{tw.hero}</TwLabel>
      <div style={{ display:'flex', gap: 6, marginTop: 6 }}>
        {[
          ['A', lang==='id'?'Grid':'Grid'],
          ['B', lang==='id'?'Split':'Split'],
          ['C', lang==='id'?'Tipografi':'Type'],
        ].map(([k,v])=>(
          <button key={k} onClick={()=>setHero(k)} style={{
            flex:1, padding:'10px 6px', borderRadius: 10, cursor:'pointer',
            background: hero === k ? 'var(--yellow)' : 'var(--bg)',
            color: 'var(--navy)',
            border:'1px solid ' + (hero === k ? 'var(--navy-900)' : 'var(--line)'),
            fontSize: 11, fontWeight: 600, fontFamily:'var(--font-display)',
          }}>{v}</button>
        ))}
      </div>
    </div>
  );
}

const TwLabel = ({ children, style }) => (
  <div className="mono" style={{ fontSize: 10, color:'var(--muted)', letterSpacing:'0.1em', textTransform:'uppercase', ...style }}>
    {children}
  </div>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
